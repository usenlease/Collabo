<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Cloud Collabo | Control Room</title><style>*{box-sizing:border-box}body{margin:0;font:15px system-ui,Arial;background:#f3f7f5;color:#183b2c}header{background:#123e2a;color:white;padding:24px 5%}main{max-width:1200px;margin:24px auto;padding:0 16px}nav{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}button{padding:11px 15px;border:1px solid #bad0c1;border-radius:9px;background:white;cursor:pointer;font-weight:650}button[aria-selected=true]{background:#16653f;color:white}.panel{background:white;border:1px solid #d6e4dc;border-radius:12px;padding:18px;margin:14px 0}table{border-collapse:collapse;width:100%;font-size:13px}td,th{padding:10px;text-align:left;border-bottom:1px solid #e3e9e5}th{background:#eff6f1}.scroll{overflow:auto}.muted{color:#64746c}.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px}.tile{background:#edf7f0;padding:14px;border-radius:10px}.tile strong{display:block;font-size:24px}input{padding:11px;width:min(100%,420px);border:1px solid #c5d8cc;border-radius:8px}</style></head><body><header><h1>Cloud Collabo · Control Room</h1><p>Administrator reporting and project oversight</p></header><main><div id="access" class="panel" role="status">Checking administrator access…</div><nav id="tabs" hidden><button data-tab="members">All Members</button><button data-tab="collabos">All Collabos</button><button data-tab="finances">Finances</button><button data-tab="locations">Collabo Locations</button><button data-tab="manage">Manage Collabos</button><button data-tab="emails">Emails &amp; Messages</button></nav><section id="content" class="panel" hidden></section><p><a href="/">← Back to Cloud Collabo</a></p></main><script src="/clerk-auth.js"></script><script>
const access=document.getElementById('access'),tabs=document.getElementById('tabs'),content=document.getElementById('content');let report=null;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const table=(cols,rows)=>'<div class="scroll"><table><thead><tr>'+cols.map(c=>'<th>'+esc(c)+'</th>').join('')+'</tr></thead><tbody>'+rows.map(row=>'<tr>'+row.map(v=>'<td>'+esc(v)+'</td>').join('')+'</tr>').join('')+'</tbody></table></div>';
function show(tab){tabs.querySelectorAll('button').forEach(b=>b.setAttribute('aria-selected',String(b.dataset.tab===tab)));const d=report;let out='';
if(tab==='members')out='<h2>All Members</h2><p class="muted">'+esc(d.member_counts.note)+'</p><div class="tiles"><div class="tile"><strong>'+d.member_counts.known_unique_members+'</strong>Known members</div><div class="tile"><strong>'+d.member_counts.initiators+'</strong>Initiators</div><div class="tile"><strong>'+d.member_counts.applicants+'</strong>Applicants</div></div>'+table(['Clerk member ID','Initiator','Collaborator'],d.members.map(x=>[x.id,x.initiator?'Yes':'No',x.collaborator?'Yes':'No']));
if(tab==='collabos'||tab==='manage'){const c=d.count;out='<h2>'+ (tab==='manage'?'Manage Collabos':'All Collabos')+'</h2><div class="tiles">'+Object.entries(c).map(([k,v])=>'<div class="tile"><strong>'+v+'</strong>'+esc(k.replaceAll('_',' '))+'</div>').join('')+'</div><p class="muted">'+(tab==='manage'?'Administrative stop/pause controls will be enabled only after audit logging and participant notifications are secured.':'Showing the latest 500 projects; no-collaborator means no approved application.')+'</p><label>Find a Collabo <input id="filter" placeholder="Search project title, category or location"></label><div id="project-list"></div>'; }
if(tab==='finances')out='<h2>Finances</h2><p>Verified platform revenue: <strong>Not connected</strong></p><p>Verified transactions: <strong>Not connected</strong></p><p class="muted">'+esc(d.finances.note)+'</p>';
if(tab==='locations')out='<h2>Collabo Locations</h2><p class="muted">Grouped by the last component of the recorded location. These may be cities, counties or countries; country ranking requires normalized country fields.</p>'+table(['Recorded area','Collabos'],d.locations.map(x=>[x.name,x.count]));
if(tab==='emails')out='<h2>Emails &amp; Messages</h2><p>Broadcast sending is not yet enabled.</p><p class="muted">'+esc(d.email.note)+'</p>';
content.innerHTML=out;if(tab==='collabos'||tab==='manage'){const input=document.getElementById('filter'),host=document.getElementById('project-list');const render=()=>{const q=input.value.toLowerCase();host.innerHTML=table(['Collabo','Category','Location','Status','Approved','Applications'],d.collabos.filter(x=>(x.title+' '+x.category+' '+x.location).toLowerCase().includes(q)).map(x=>[x.title,x.category,x.location,x.status,x.approved_collaborators,x.applications]));};input.oninput=render;render();}}
tabs.addEventListener('click',e=>{const b=e.target.closest('[data-tab]');if(b)show(b.dataset.tab)});
async function load(){try{if(!window.Clerk?.session){access.innerHTML='Please <button id="signin">sign in</button> with your authorized administrator account.';document.getElementById('signin').onclick=()=>window.cloudCollaboSignIn?.();return}const token=await window.Clerk.session.getToken();const res=await fetch('/api/admin/overview',{headers:{authorization:'Bearer '+token}});const data=await res.json();if(!res.ok)throw Error(data.error||'Unable to load admin report');report=data;access.hidden=true;tabs.hidden=false;content.hidden=false;show('collabos')}catch(e){access.textContent=e.message}}
window.addEventListener('cloudcollabo-auth-changed',load);let attempts=0;const wait=setInterval(()=>{if(window.Clerk||++attempts>30){clearInterval(wait);load()}},300);
</script></body></html>
