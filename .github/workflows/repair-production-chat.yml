name: Repair Cloud Collabo production chat database
on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'Type REPAIR_CHAT_DATABASE to back up and migrate production D1'
        required: true
        type: string
permissions:
  contents: read
jobs:
  repair-chat:
    if: ${{ inputs.confirmation == 'REPAIR_CHAT_DATABASE' }}
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Install Wrangler
        run: npm install --no-save wrangler@4
      - name: Back up production D1 before changes
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 export collabodb --remote --output=collabodb-before-chat-repair.sql
      - name: Upload database backup
        uses: actions/upload-artifact@v4
        with:
          name: collabodb-before-chat-repair
          path: collabodb-before-chat-repair.sql
          retention-days: 14
      - name: Create missing collaboration and chat tables
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 execute collabodb --remote --file=migrations/0003_role_applications_team_chat.sql
      - name: Verify production chat tables
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 execute collabodb --remote --command="SELECT name FROM sqlite_master WHERE type='table' AND name IN ('project_needs','role_applications','project_team_messages') ORDER BY name;"
