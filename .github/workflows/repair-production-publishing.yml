name: Repair Cloud Collabo publishing database
on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'Type REPAIR_PUBLISHING_DATABASE to back up and repair production D1'
        required: true
        type: string
permissions:
  contents: read
jobs:
  repair-publishing:
    if: ${{ inputs.confirmation == 'REPAIR_PUBLISHING_DATABASE' }}
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Install Wrangler
        run: npm install --no-save wrangler@4
      - name: Verify Cloudflare credentials are configured
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Cloudflare credentials missing. Set CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID as GitHub Actions secrets in the production environment (or repository)."
            exit 1
          fi
      - name: Back up production D1
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 export collabodb --remote --output=collabodb-before-publishing-repair.sql
      - name: Preserve database backup
        uses: actions/upload-artifact@v4
        with:
          name: collabodb-before-publishing-repair
          path: collabodb-before-publishing-repair.sql
          retention-days: 14
      - name: Apply collaboration requirements migration
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 execute collabodb --remote --file=migrations/0003_role_applications_team_chat.sql
      - name: Verify required tables
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 execute collabodb --remote --command="SELECT name FROM sqlite_master WHERE type='table' AND name IN ('projects','project_needs','role_applications','project_team_messages') ORDER BY name;"
